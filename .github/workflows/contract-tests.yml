name: 上游契约测试

# 东财/新浪的端点没有任何合约，随时可能变结构或下线
# （fundgz 的盘中估值就是这么没的）。每日跑一次真实端点测试是唯一的早期预警。
on:
  schedule:
    - cron: '0 1 * * *' # 北京时间 09:00
  workflow_dispatch:
  push:
    paths:
      - 'apps/api/src/sources/**'
      - 'tests/**'

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: 真实端点契约测试
        run: npm run test:live
      - name: 解析器失效告警
        if: failure()
        run: |
          echo "::error::上游契约测试失败 —— 检查 apps/api/src/sources/ 下的解析器"
          echo "见 docs/data-sources.md「契约测试为什么会红」。红了只有两种可能："
          echo "  1. 真的契约破坏（4xx / HTML 错误页 / 非法 JSON / 断言不符）→ 改解析器"
          echo "  2. 全部用例都被跳过 → Actions 出口整体不通，不是上游改了"
          echo "传输层抖动（ETIMEDOUT / socket 关闭 / 5xx）会 skip 成黄色警告，不会红。"
