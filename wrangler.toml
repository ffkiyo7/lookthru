name = "lookthru"
main = "apps/api/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 前端由同一个 Worker 托管（Workers Static Assets，非 Pages）。
# 静态资源请求不计入 Workers 请求计费；前端与 API 同源，无 CORS。
[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
# 前端是 SPA：未匹配到静态资源的导航请求返回 index.html
not_found_handling = "single-page-application"
# /api/* 必须先进 Worker，不能被 SPA fallback 吞掉
run_worker_first = ["/api/*"]

[observability]
enabled = true

# ── P0 阶段：每 5 分钟探测一次东财出口通过率 ──────────────────
# P1 起替换为正式时刻表（UTC，北京时间 = UTC+8）：
#   "25 1 * * 1-5"            09:25 交易日检查 + 预热
#   "* 1-3,5-7 * * 1-5"       09:30-11:30 / 13:00-15:00 每分钟估值
#   "5 7 * * 1-5"             15:05 收盘快照
#   "30,0 11-14 * * 1-5"      19:30-22:30 每 30min 拉官方净值
#   "0 13 * * 1-5"            21:00 IM 日报
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lookthru"
database_id = "PLACEHOLDER_RUN_wrangler_d1_create_lookthru"
migrations_dir = "apps/api/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "PLACEHOLDER_RUN_wrangler_kv_namespace_create_CACHE"

[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "lookthru-archive"

[vars]
ENVIRONMENT = "development"
