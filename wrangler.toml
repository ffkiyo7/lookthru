name = "lookthru"
main = "apps/api/src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 前端由同一个 Worker 托管（Workers Static Assets，非 Pages）。
# 静态资源请求不计入 Workers 请求计费；前端与 API 同源，无 CORS。
[assets]
directory = "./apps/web/dist"
binding = "ASSETS"
# 前端是 SPA：未匹配到静态资源的导航请求返回 index.html
not_found_handling = "single-page-application"
# /api/* 必须先进 Worker，不能被 SPA fallback 吞掉
run_worker_first = ["/api/*"]

[observability]
enabled = true

# webhook 只能以 AES-GCM 密文落 D1；缺密钥的版本必须在部署阶段失败，
# 不能等到 21:00 第一次发日报时才暴露。
[secrets]
required = ["NOTIFY_KEY"]

# Workers Paid（已订阅）：每次调用 30s CPU，不再是免费版的 10ms。
# 显式写出来，免得以后照着旧约束做无谓的裁剪。
[limits]
cpu_ms = 30000

# 节点本地的宽松滥用挡板；正常请求不再为计数器往返普通 KV。
# namespace_id 是本项目在 Cloudflare 账户内分配的稳定数字标识。
[[ratelimits]]
name = "PUBLIC_FUNDS_RATE_LIMITER"
namespace_id = "2026081301"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PUBLIC_AUTH_RATE_LIMITER"
namespace_id = "2026081302"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "PUBLIC_STATUS_RATE_LIMITER"
namespace_id = "2026081303"

  [ratelimits.simple]
  limit = 60
  period = 60

# 旧值命中后的后台刷新按数据键合并，避免并发访客各打一遍上游。
[[ratelimits]]
name = "SHARED_REFRESH_RATE_LIMITER"
namespace_id = "2026081304"

  [ratelimits.simple]
  limit = 1
  period = 60

# 正式时刻表（UTC，北京时间 = UTC+8）。探针继续保留，用来发现出口地域漂移。
# 估值 cron 只能框住小时，scheduled dispatcher 会再收紧到 09:30-11:30 / 13:00-15:00。
# 官方净值拆成半点与整点两条，避免错误地从北京时间 19:00 开跑。
# Cloudflare 的星期编号是 1=周日，因此周一到周五必须写 2-6。
[triggers]
crons = [
  "*/5 * * * *",
  "25 1 * * 2-6",
  "* 1-3,5-7 * * 2-6",
  "5 7 * * 2-6",
  "30 11-14 * * 2-6",
  "0 12-14 * * 2-6",
  "0 13 * * 2-6",
  "0 14 * * 2-6",
]

# 资源 id 不写进版本库。真实值放在 gitignore 的 .wrangler-ids 里，
# `node scripts/gen-wrangler.mjs` 会替换占位符生成 .wrangler.generated.toml。
# 见 .wrangler-ids.example。
[[d1_databases]]
binding = "DB"
database_name = "lookthru"
database_id = "PLACEHOLDER_D1_DATABASE_ID"
migrations_dir = "apps/api/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "PLACEHOLDER_KV_CACHE_ID"

# 净值全历史 / 全量基金列表 / 持仓明细归档。放 R2 而非 D1：
# 1.2 万基金 × 3000 天 = 3600 万行，D1 装不下也不该装（见 plan 3.4）
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "lookthru-archive"
